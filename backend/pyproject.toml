[project]
name = "neighborhood-tool-sharing-backend"
version = "0.1.0"
description = "ICS 613 Group 3 backend for Neighborhood Tool Sharing"
requires-python = ">=3.11,<3.14"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["src/app/tests"]
pythonpath = ["src"]
markers = [
    "acceptance: 35-user-story acceptance scenarios (src/app/tests/acceptance/)",
    "auxiliary: supplementary coverage with no user-story mapping (src/app/tests/auxiliary/)",
]
# Note: this project uses ``bcrypt`` directly, not ``passlib``. Do not
# re-add a ``passlib`` filterwarning entry without first adding passlib
# to requirements.txt.

[[tool.mypy.overrides]]
module = ["src.app.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.coverage.run]
# --cov=app sweeps up src/app/tests/* as "source" too. Without this, every
# test file reports 0% self-coverage and drags the real app-code number
# down to noise (34% instead of the true ~92%).
omit = ["*/tests/*"]

# SQLAlchemy's async ORM bridges its sync-style Core/ORM execution engine
# to asyncpg via greenlet (see greenlet_spawn in sqlalchemy.util._concurrency_py3k).
# coverage's default tracer doesn't follow execution across a greenlet
# switch, so without this setting every line that runs *after* the first
# `await db.execute(...)` in a coroutine is invisible to coverage and
# reported as "missed" even though it demonstrably ran (the tests that
# exercise it pass). Verified locally: adding this took the reported
# TOTAL from 72% to 92% with the exact same 345 passing tests -- no new
# tests were added. See https://coverage.readthedocs.io/en/latest/config.html#run-concurrency
concurrency = ["greenlet"]

[tool.bandit]
# Exclude test files and certain false-positive checks.
exclude_dirs = ["tests"]
skips = [
    "B101",  # assert used — normal in tests and validation
    "B105",  # hardcoded_password_string — false positives on enum values
    "B106",  # hardcoded_password_funcarg — test credentials, not production secrets
    "B110",  # try_except_pass — acceptable in schema validators
    "B311",  # random — used for non-security purposes
    "B603",  # subprocess_without_shell_equals_true — not used
    "B607",  # start_process_with_partial_path — not used
]
